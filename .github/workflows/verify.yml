name: Verificação técnica
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes unitários e contratos
        run: npm test
      - name: Compilar frontend
        run: npm run build
